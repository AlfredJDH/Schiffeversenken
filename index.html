<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schiffe versenken</title>
<meta name="description" content="Schiffe versenken für zwei Smartphones. Link teilen und losspielen.">
<meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1626" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c3fa0'/%3E%3Cpath d='M9 9l14 14M23 9L9 23' stroke='%23ffe24a' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column. The boards are sheets of squared paper (Karopapier);
   everything around them is pencil notes, ballpoint ink and one stroke of highlighter. */
:root{
  --paper:#f6f8fa;      /* desk / page */
  --sheet:#ffffff;      /* the squared paper itself */
  --rule:#bfd0e6;       /* printed grid lines */
  --ink:#1c3fa0;        /* ballpoint blue: ships, buttons */
  --on-ink:#ffffff;
  --pencil:#262b36;     /* text */
  --soft:#5d6675;       /* secondary text */
  --red:#d2332c;        /* red pencil: hits */
  --marker:#ffe24a;     /* highlighter: your turn, your target */
  --on-marker:#262b36;
  --ok:#1f8a4c;
  --display:"Kalam","Segoe Print","Bradley Hand",cursive;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0f1626; --sheet:#162038; --rule:#30415f; --ink:#93b4ff; --on-ink:#0f1626;
    --pencil:#e8ebf2; --soft:#9aa6bd; --red:#ff6f61; --marker:#f2d544; --on-marker:#1a1f2b; --ok:#5fd08d;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--pencil);
  font:400 16px/1.45 var(--body);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  -webkit-tap-highlight-color:transparent;
}
[hidden]{display:none!important}
.app{max-width:30rem; margin:0 auto; padding-inline:16px; padding-block:10px 28px; display:flex; flex-direction:column; gap:14px}

/* ---------- header ---------- */
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 10px; min-height:36px}
.top h1{font:700 1.45rem/1 var(--display); margin:0; letter-spacing:.01em; padding-top:.2em; white-space:nowrap}
.conn{display:flex; align-items:center; gap:7px; font-size:.8rem; color:var(--soft); white-space:nowrap}
.conn b{font-weight:700; color:var(--pencil); letter-spacing:.08em; font-variant-numeric:tabular-nums}
.dot{width:9px; height:9px; border-radius:50%; background:var(--soft); flex:none}
.dot.on{background:var(--ok)}
.dot.wait{background:var(--marker); box-shadow:0 0 0 1px var(--soft) inset}
.dot.off{background:var(--red)}

/* ---------- type ---------- */
h2{font:700 1.5rem/1.15 var(--display); margin:0; text-wrap:balance}
p{margin:0}
.soft{color:var(--soft)}
.small{font-size:.875rem}
.label{font-size:.72rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--soft)}
.stack{display:flex; flex-direction:column; gap:12px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.row > .grow{flex:1 1 0; min-width:0}

/* ---------- controls ---------- */
button, input{font:inherit; color:inherit}
.btn{
  appearance:none; border:2px solid var(--ink); background:transparent; color:var(--ink);
  font-weight:700; padding:.72em 1.1em; border-radius:10px; cursor:pointer; min-height:48px;
  touch-action:manipulation;
}
.btn.primary{background:var(--ink); color:var(--on-ink)}
.btn.fire{background:var(--marker); color:var(--on-marker); border-color:var(--pencil); font-size:1.1rem; width:100%}
.btn:disabled{opacity:.45; cursor:default}
.btn.fire:disabled{background:transparent; color:var(--soft); border-color:var(--rule); opacity:1}
.btn.quiet{border-color:transparent; color:var(--soft); font-weight:600; min-height:40px; padding:.4em .6em; text-decoration:underline; text-underline-offset:3px}
.btn.danger{border-color:var(--red); color:var(--red)}
:focus-visible{outline:3px solid var(--marker); outline-offset:2px}
.seg{display:grid; grid-template-columns:1fr 1fr; border:2px solid var(--ink); border-radius:10px; overflow:hidden}
.seg button{appearance:none; border:0; background:transparent; color:var(--ink); padding:.6em .5em; font-weight:600; cursor:pointer; min-height:48px; line-height:1.2}
.seg button small{display:block; font-weight:400; font-size:.78rem; opacity:.85}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--on-ink)}
.code-in{
  width:100%; min-width:0; border:2px solid var(--rule); background:var(--sheet); border-radius:10px;
  padding:.6em .7em; min-height:48px; font-weight:700; letter-spacing:.3em; text-transform:uppercase; text-align:center;
}
.code-in::placeholder{letter-spacing:.05em; font-weight:400; text-transform:none; color:var(--soft)}
.link-in{width:100%; border:1px dashed var(--rule); background:transparent; border-radius:8px; padding:.5em .6em; font-size:.8rem; color:var(--soft)}
hr{border:0; border-top:1px dashed var(--rule); margin:2px 0; width:100%}
details{font-size:.9rem; color:var(--soft)}
details summary{cursor:pointer; font-weight:600; color:var(--pencil); padding:.3em 0}
details ul{margin:.3em 0 0; padding-left:1.2em; display:flex; flex-direction:column; gap:.3em}

/* ---------- invite note ---------- */
.note{background:var(--sheet); border:1.5px solid var(--rule); border-radius:4px 14px 6px 12px; padding:12px 14px; display:flex; flex-direction:column; gap:8px}
.note .code{font:700 2.1rem/1 var(--display); letter-spacing:.14em; padding-top:.15em}

/* ---------- boards ---------- */
.sea{
  --lab:1.25rem;
  display:grid; grid-template-columns:var(--lab) minmax(0,1fr); grid-template-rows:var(--lab) auto;
  width:100%; margin-inline:auto; user-select:none; -webkit-user-select:none;
}
.sea.big{max-width:min(100%, 27rem)}
#seaTarget{max-width:min(100%, max(15rem, calc(100dvh - 19rem)), 27rem)}  /* keep the fire button on screen */
.sea .cols, .sea .rows{display:grid; font:700 .85rem/1 var(--display); color:var(--ink); text-align:center; align-items:center}
.sea .cols{grid-column:2; grid-template-columns:repeat(10,1fr)}
.sea .rows{grid-column:1; grid-row:2; grid-template-rows:repeat(10,1fr); font-variant-numeric:tabular-nums}
.board{
  grid-column:2; grid-row:2; display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:1px;
  background:var(--rule); border:2px solid var(--ink); border-radius:3px; aspect-ratio:1; position:relative;
}
.cell{appearance:none; border:0; padding:0; margin:0; background:var(--sheet); position:relative; min-width:0; aspect-ratio:1; display:block; border-radius:0}
button.cell{cursor:pointer; touch-action:manipulation}
.cell::before, .cell::after{content:""; position:absolute; pointer-events:none}

/* ships: ballpoint-filled hulls that run across the grid lines */
.cell.ship::before{background:var(--ink); z-index:1}
.cell.sh::before{inset:17% -1px}
.cell.sv::before{inset:-1px 17%}
.cell.sh.s0::before{left:10%; border-radius:99px 0 0 99px}
.cell.sh.s1::before{right:10%; border-radius:0 99px 99px 0}
.cell.sv.s0::before{top:10%; border-radius:99px 99px 0 0}
.cell.sv.s1::before{bottom:10%; border-radius:0 0 99px 99px}
.cell.dead::before{opacity:.35}
.cell.sunk::before{background:var(--red); opacity:.28}
.cell.ghost::before{background:transparent; border:2px dashed var(--ink); opacity:.8}
.cell.ghost.sh::before{border-left-width:0; border-right-width:0}
.cell.ghost.sh.s0::before{border-left-width:2px}
.cell.ghost.sh.s1::before{border-right-width:2px}
.cell.ghost.sv::before{border-top-width:0; border-bottom-width:0}
.cell.ghost.sv.s0::before{border-top-width:2px}
.cell.ghost.sv.s1::before{border-bottom-width:2px}
.cell.lift::before{opacity:.7; box-shadow:0 0 0 2px var(--marker)}
.cell.bad::before{background:var(--red)}

/* marks */
.cell.miss::after{inset:36%; border-radius:50%; background:var(--ink); opacity:.55; z-index:2}
.cell.nope::after{inset:42%; border-radius:50%; background:var(--soft); opacity:.4; z-index:2}
.cell.pend::after{inset:26%; border-radius:50%; border:2px dashed var(--soft); z-index:2; animation:spin 2.4s linear infinite}
.cell.hit::after{
  inset:12%; z-index:2;
  background:
    linear-gradient(45deg, transparent 44%, var(--red) 44% 56%, transparent 56%),
    linear-gradient(-45deg, transparent 44%, var(--red) 44% 56%, transparent 56%);
}
.cell.sel{background:var(--marker)}
.cell.sel::after{inset:18%; border:2px solid var(--on-marker); border-radius:50%; z-index:2}
.cell.last{box-shadow:0 0 0 2px var(--marker) inset; z-index:3}
.board.locked .cell{cursor:default}
.board.drag{touch-action:none}
.board.drag .cell.ship{cursor:grab}
.board.shake{animation:shake .3s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pop{from{transform:scale(1.5); opacity:0}}
.cell.last::after{animation:pop .35s ease-out}
.cell.pend.last::after{animation:spin 2.4s linear infinite}
@media (prefers-reduced-motion: reduce){ .cell::after, .board{animation:none!important} }

/* ---------- battle ---------- */
.status{display:flex; flex-direction:column; gap:2px; min-height:4.2rem}
.status h2{font-size:1.8rem}
.status h2 .hl{text-decoration:underline; text-decoration-color:var(--marker); text-decoration-thickness:.42em; text-underline-offset:-.16em; text-decoration-skip-ink:none}
.status .warn{color:var(--red); font-weight:600}
.mini{display:grid; grid-template-columns:minmax(0,11fr) minmax(0,9fr); gap:14px; align-items:start}
.mini .sea{--lab:.9rem}
.mini .sea .cols, .mini .sea .rows{font-size:.6rem}
.tally{display:flex; flex-direction:column; gap:10px; min-width:0}
.pips{display:flex; flex-wrap:wrap; gap:5px 8px; margin-top:4px}
.pip{display:inline-flex; gap:1px; position:relative}
.pip i{width:8px; height:8px; background:var(--ink); display:block}
.pip i:first-child{border-radius:4px 0 0 4px}
.pip i:last-child{border-radius:0 4px 4px 0}
.pip.dead i{background:var(--soft); opacity:.45}
.pip.dead::after{content:""; position:absolute; left:-2px; right:-2px; top:50%; border-top:2px solid var(--red); transform:rotate(-8deg)}
.hero{display:grid; grid-template-columns:minmax(0,1fr); gap:6px}
.hero .sea{max-width:15rem; --lab:1rem}
.hero .sea .cols, .hero .sea .rows{font-size:.7rem}
.hero .cap{text-align:center}

/* ---------- toast ---------- */
#toast{
  position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px);
  background:var(--pencil); color:var(--paper); padding:.6em 1em; border-radius:99px; font-weight:600; font-size:.9rem;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:calc(100% - 32px); text-align:center; z-index:10;
}
#toast.show{opacity:1; transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Schiffe versenken</h1>
    <div class="conn" id="conn" hidden><span class="dot" id="connDot"></span><span id="connText"></span><b id="connCode"></b></div>
  </header>
  <main id="view" class="stack"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ================= constants ================= */
const FLEETS = { klassisch:[5,4,4,3,3,3,2,2,2,2], kurz:[5,4,3,3,2] };
const NAMES  = {5:'Schlachtschiff', 4:'Kreuzer', 3:'Zerstörer', 2:'U-Boot'};
const YOURS  = {5:'dein Schlachtschiff', 4:'deinen Kreuzer', 3:'deinen Zerstörer', 2:'dein U-Boot'};
const LETTERS = 'ABCDEFGHIJ';
const KEY = 'schiffe-versenken-v1';
const PEER_PREFIX = 'schiffe-versenken-v1-';
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const PEER_LIB = [
  'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'
];

const $ = id => document.getElementById(id);
const view = $('view');
const cellName = c => LETTERS[c % 10] + (Math.floor(c / 10) + 1);
const isCell = c => Number.isInteger(c) && c >= 0 && c < 100;

/* ================= state ================= */
function blank(){
  return { code:null, role:null, token:null, guest:null, fleet:'klassisch', met:false, g:0,
           ships:[], ready:false, peerReady:false, fired:[], recv:[], reveal:null };
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && typeof s === 'object' && s.code && FLEETS[s.fleet] && Array.isArray(s.ships)) return Object.assign(blank(), s);
  }catch(e){}
  return null;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

let S = load() || blank();
/* runtime only */
const R = { screen:null, status:'idle', peer:null, conn:null, lastSeen:0, probe:0, backoff:0, restartTimer:null, dialTimer:null,
            hostOffline:false, peerLeft:false, full:false, sel:null, drag:null, confirmLeave:false, pickFleet:'klassisch', showLink:false };

/* ================= fleet geometry ================= */
function cellsOf(s){ const a=[]; for(let i=0;i<s.len;i++) a.push(s.h ? s.y*10+s.x+i : (s.y+i)*10+s.x); return a; }
function inBounds(s){ return s.x>=0 && s.y>=0 && (s.h ? s.x+s.len<=10 && s.y<10 : s.y+s.len<=10 && s.x<10); }
function touches(a, b){
  for (const p of cellsOf(a)) for (const q of cellsOf(b))
    if (Math.abs(p%10 - q%10) <= 1 && Math.abs(Math.floor(p/10) - Math.floor(q/10)) <= 1) return true;
  return false;
}
function fits(ships, i, cand){
  if (!inBounds(cand)) return false;
  for (let j=0;j<ships.length;j++) if (j!==i && touches(cand, ships[j])) return false;
  return true;
}
function randomLayout(fleet){
  for (let attempt=0; attempt<500; attempt++){
    const ships=[]; let ok=true;
    for (const len of fleet){
      let placed=false;
      for (let t=0;t<300 && !placed;t++){
        const h = Math.random()<.5;
        const cand = {len, h, x:Math.floor(Math.random()*(h?11-len:10)), y:Math.floor(Math.random()*(h?10:11-len))};
        if (fits(ships, -1, cand)){ ships.push(cand); placed=true; }
      }
      if(!placed){ ok=false; break; }
    }
    if (ok) return ships;
  }
  return [];
}
function validLayout(ships, fleet){
  if (!Array.isArray(ships) || ships.length!==fleet.length) return false;
  const a = ships.map(s=>s.len).sort().join(), b = fleet.slice().sort().join();
  if (a!==b) return false;
  return ships.every((s,i)=> fits(ships, i, s));
}
function around(cells){
  const out = new Set();
  for (const c of cells){
    const x=c%10, y=Math.floor(c/10);
    for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
      const nx=x+dx, ny=y+dy;
      if (nx>=0&&nx<10&&ny>=0&&ny<10) out.add(ny*10+nx);
    }
  }
  cells.forEach(c=>out.delete(c));
  return out;
}

/* ================= game rules ================= */
const total = () => FLEETS[S.fleet].reduce((a,b)=>a+b,0);
const started = () => S.fired.length + S.recv.length > 0;
function iStart(){ return (S.role==='host') === (S.g % 2 === 0); }
function lastShot(){
  let best=null;
  for (const f of S.fired) if (!best || f.n>best.n) best = {n:f.n, c:f.c, r:f.r, sunk:f.sunk, mine:true};
  for (const f of S.recv)  if (!best || f.n>best.n) best = {n:f.n, c:f.c, r:f.r, sunk:f.sunk, mine:false};
  return best;
}
function outcome(){
  if (S.fired.filter(f=>f.r==='h').length >= total()) return 'won';
  if (S.recv.filter(f=>f.r==='h').length  >= total()) return 'lost';
  return null;
}
/* 'me' | 'them' | 'wait' (my shot is on its way) */
function turn(){
  const l = lastShot();
  if (!l) return iStart() ? 'me' : 'them';
  if (l.r == null) return l.mine ? 'wait' : 'them';
  return (l.mine === (l.r==='h')) ? 'me' : 'them';
}
function resetGame(g){
  S.g = g; S.ships = randomLayout(FLEETS[S.fleet]); S.ready=false; S.peerReady=false;
  S.fired=[]; S.recv=[]; S.reveal=null; R.sel=null;
}

/* ================= incoming / outgoing shots ================= */
function acceptShot(n, c, force){
  if (!isCell(c)) return;
  let e = S.recv.find(x=>x.c===c);
  if (!e){
    if (!validLayout(S.ships, FLEETS[S.fleet])) return;
    if (!force && (outcome() || turn()!=='them')) return;
    S.ready = true; S.peerReady = true;
    const ship = S.ships.find(s=>cellsOf(s).includes(c));
    e = {n:Number.isInteger(n)?n:S.fired.length+S.recv.length, c, r: ship?'h':'m'};
    if (ship){
      const cs = cellsOf(ship);
      if (cs.every(k => k===c || S.recv.some(x=>x.c===k))) e.sunk = cs;
    }
    S.recv.push(e);
    buzz(e.r==='h' ? (e.sunk?[60,60,60,60,200]:[120]) : 20);
  }
  send(Object.assign({t:'res'}, e));
}
function applyResult(m){
  if (!isCell(m.c)) return;
  let f = S.fired.find(x=>x.c===m.c);
  if (!f){ f = {n:Number.isInteger(m.n)?m.n:S.fired.length+S.recv.length, c:m.c, r:null}; S.fired.push(f); }
  if (f.r != null) return;
  f.r = m.r==='h' ? 'h' : 'm';
  if (Array.isArray(m.sunk)){
    const cs = m.sunk.filter(isCell).slice(0,5).sort((a,b)=>a-b);
    if (cs.length>=2) f.sunk = cs;
  }
  buzz(f.r==='h' ? (f.sunk?[40,40,40,40,160]:[80]) : 15);
}
function fire(){
  const c = R.sel;
  if (c==null || turn()!=='me' || outcome() || !online() || S.fired.some(f=>f.c===c)) return;
  const n = S.fired.length + S.recv.length;
  S.fired.push({n, c, r:null});
  R.sel = null; save();
  send({t:'shot', n, c});
  paint();
}
function buzz(p){ try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* ================= connection (PeerJS) ================= */
let gen = 0, libPromise = null;
const online = () => !!(R.conn && R.conn.open);

function loadLib(){
  if (window.Peer) return Promise.resolve();
  if (libPromise) return libPromise;
  libPromise = new Promise((resolve, reject) => {
    let i = 0;
    const next = () => {
      if (window.Peer) return resolve();
      if (i >= PEER_LIB.length){ libPromise = null; return reject(new Error('lib')); }
      const s = document.createElement('script');
      s.src = PEER_LIB[i++]; s.onload = next; s.onerror = next;
      document.head.appendChild(s);
    };
    next();
  });
  return libPromise;
}
function setStatus(s){ if (R.status!==s){ R.status = s; paint(); } }
function stopLink(){
  gen++;
  clearTimeout(R.restartTimer); R.restartTimer=null;
  clearTimeout(R.dialTimer); R.dialTimer=null;
  const p = R.peer; R.peer=null; R.conn=null;
  if (p) try{ p.destroy(); }catch(e){}
}
function scheduleRestart(){
  if (R.restartTimer || !S.code) return;
  const d = Math.min(8000, 700 * Math.pow(2, R.backoff)); R.backoff++;
  R.restartTimer = setTimeout(()=>{ R.restartTimer=null; startLink(); }, d);
}
function startLink(){
  stopLink();
  if (!S.code || R.full) return;
  const my = gen;
  if (R.status!=='reconnecting') setStatus('connecting');
  loadLib().then(() => {
    if (my!==gen) return;
    const opts = {debug:0};
    const peer = S.role==='host' ? new window.Peer(PEER_PREFIX+S.code, opts) : new window.Peer(opts);
    R.peer = peer;
    peer.on('open', () => {
      if (my!==gen) return;
      if (S.role==='host'){ if (!online()) setStatus('waiting'); }
      else dial(my);
    });
    peer.on('connection', c => {
      if (my!==gen || S.role!=='host'){ try{ c.close(); }catch(e){} return; }
      const tok = c.metadata && typeof c.metadata.token==='string' ? c.metadata.token : null;
      const ok = tok && (!S.guest || S.guest===tok || (!started() && !online()));
      if (!ok){
        c.on('open', () => { try{ c.send({t:'full'}); }catch(e){} setTimeout(()=>{ try{ c.close(); }catch(e){} }, 600); });
        return;
      }
      if (S.guest!==tok){ S.guest = tok; S.peerReady = false; save(); }
      wire(c, my);
    });
    peer.on('disconnected', () => { if (my===gen && !online()) scheduleRestart(); });
    peer.on('close', () => { if (my===gen && !online()) scheduleRestart(); });
    peer.on('error', err => {
      if (my!==gen) return;
      const t = err && err.type;
      if (t==='peer-unavailable'){
        R.hostOffline = true; paint();
        clearTimeout(R.dialTimer);
        R.dialTimer = setTimeout(()=>dial(my), 3000);
        return;
      }
      if (!online()){ setStatus('reconnecting'); scheduleRestart(); }
    });
  }).catch(() => {
    if (my!==gen) return;
    setStatus('nolib'); scheduleRestart();
  });
}
function dial(my){
  if (my!==gen || !R.peer || R.peer.destroyed || online()) return;
  if (R.peer.disconnected){ scheduleRestart(); return; }
  if (R.pending && R.pending!==R.conn){ try{ R.pending.close(); }catch(e){} }
  let c;
  try{ c = R.peer.connect(PEER_PREFIX+S.code, {reliable:true, serialization:'json', metadata:{token:S.token}}); }
  catch(e){ scheduleRestart(); return; }
  if (!c){ scheduleRestart(); return; }
  R.pending = c;
  wire(c, my);
  clearTimeout(R.dialTimer);
  R.dialTimer = setTimeout(()=>{ if (my===gen && !online()){ try{ c.close(); }catch(e){} scheduleRestart(); } }, 12000);
}
function wire(c, my){
  c.on('open', () => {
    if (my!==gen){ try{ c.close(); }catch(e){} return; }
    if (R.conn && R.conn!==c){ const old=R.conn; R.conn=null; try{ old.close(); }catch(e){} }
    R.conn = c; R.lastSeen = Date.now(); R.probe = 0; R.backoff = 0; R.hostOffline = false; R.peerLeft = false;
    clearTimeout(R.dialTimer); clearTimeout(R.restartTimer); R.restartTimer=null;
    R.status = 'connected';
    sendHello(); paint();
  });
  c.on('data', d => { if (my===gen && R.conn===c){ R.lastSeen = Date.now(); onMsg(d); } });
  const gone = () => {
    if (R.conn!==c) return;
    R.conn = null;
    if (my===gen){ setStatus('reconnecting'); paint(); scheduleRestart(); }
  };
  c.on('close', gone);
  c.on('error', gone);
}
function send(o){
  if (!online()) return;
  try{ R.conn.send(Object.assign({g:S.g}, o)); }catch(e){}
}
function sendHello(){
  send({t:'hello', fleet:S.fleet, ready:!!S.ready, recv:S.recv, fired:S.fired.map(f=>({n:f.n, c:f.c}))});
  if (outcome()) send({t:'reveal', ships:S.ships});
}
function onMsg(m){
  if (!m || typeof m!=='object') return;
  if (m.t==='ping'){
    send({t:'pong'});
    /* self-healing: the ping carries a digest of the sender's state; if it disagrees with ours, sync again */
    const d = Array.isArray(m.d) ? m.d : null;
    if (d && (m.g!==S.g || !!d[0]!==S.peerReady || d[1]!==S.recv.length || d[2]!==S.fired.filter(f=>f.r).length || (S.role==='guest' && !S.met))){
      sendHello(); send({t:'hi'});
    }
    return;
  }
  if (m.t==='pong') return;
  if (m.t==='hi'){ sendHello(); return; }
  if (m.t==='full'){ R.full = true; stopLink(); S = blank(); save(); setHash(''); paint(); return; }
  if (m.t==='bye'){ R.peerLeft = true; paint(); return; }
  if (!Number.isInteger(m.g)) return;
  const before = outcome();
  let reply = false;
  if (m.t==='again' || m.t==='hello'){
    if (m.g > S.g){ resetGame(m.g); if (m.t==='again'){ save(); sendHello(); paint(); return; } reply = true; }
    else if (m.g < S.g){ sendHello(); return; }
    if (m.t==='again') return;
    if (S.role==='guest' && FLEETS[m.fleet]){
      if (m.fleet!==S.fleet || !validLayout(S.ships, FLEETS[m.fleet])){
        S.fleet = m.fleet; S.ships = randomLayout(FLEETS[S.fleet]);
        if (S.ready){ S.ready = false; }
        reply = true;
      }
      S.met = true;
    }
    S.peerReady = !!m.ready;
    if (Array.isArray(m.recv)) m.recv.forEach(applyResult);
    if (Array.isArray(m.fired)) m.fired.forEach(f => { if (f && isCell(f.c) && !S.recv.some(x=>x.c===f.c)) acceptShot(f.n, f.c, true); });
    if (reply) sendHello();
  } else {
    if (m.g !== S.g) return;
    if (m.t==='ready') S.peerReady = !!m.ready;
    else if (m.t==='shot') acceptShot(m.n, m.c, false);
    else if (m.t==='res') applyResult(m);
    else if (m.t==='reveal'){
      if (Array.isArray(m.ships)) S.reveal = m.ships.slice(0,10)
        .map(s=>({len:s.len|0, x:s.x|0, y:s.y|0, h:!!s.h})).filter(s=>s.len>=2 && s.len<=5 && inBounds(s));
    }
  }
  if (!before && outcome()) send({t:'reveal', ships:S.ships});
  save(); paint();
}
/* keep-alive: notice a dead link quickly, especially after the phone was locked */
setInterval(() => {
  if (!S.code || !online()) return;
  const now = Date.now();
  const stale = now - R.lastSeen > 13000 || (R.probe && now - R.probe > 4000 && R.lastSeen < R.probe);
  if (stale){
    const c = R.conn; R.conn = null; try{ c.close(); }catch(e){}
    R.backoff = 0; setStatus('reconnecting'); startLink();
  } else send({t:'ping', d:[S.ready?1:0, S.fired.length, S.recv.length]});
}, 4000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState!=='visible' || !S.code) return;
  wake();
  if (online()){ R.lastSeen = Math.max(R.lastSeen, Date.now()-8000); R.probe = Date.now(); send({t:'ping', d:[S.ready?1:0, S.fired.length, S.recv.length]}); }
  else { R.backoff = 0; startLink(); }
});
window.addEventListener('online', () => { if (S.code && !online()){ R.backoff = 0; startLink(); } });
let wakeLock = null;
function wake(){
  try{
    if (S.code && 'wakeLock' in navigator && document.visibilityState==='visible' && !(wakeLock && !wakeLock.released))
      navigator.wakeLock.request('screen').then(w=>{ wakeLock = w; }, ()=>{});
  }catch(e){}
}

/* ================= actions ================= */
function rand(n, chars){
  const a = new Uint32Array(n); crypto.getRandomValues(a);
  let s=''; for (let i=0;i<n;i++) s += chars[a[i] % chars.length];
  return s;
}
const cleanCode = v => String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
function setHash(code){ try{ history.replaceState(null, '', location.pathname + location.search + (code ? '#'+code : '')); }catch(e){} }
function shareUrl(){ return location.origin + location.pathname + '#' + S.code; }
function createGame(){
  S = blank();
  S.code = rand(5, ALPHABET); S.role='host'; S.token = rand(16, 'abcdefghijklmnopqrstuvwxyz0123456789');
  S.fleet = R.pickFleet; S.met = true; S.ships = randomLayout(FLEETS[S.fleet]);
  R.full=false; R.backoff=0; save(); setHash(S.code); startLink(); wake(); paint();
}
function joinGame(code){
  code = cleanCode(code);
  if (code.length!==5){ toast('Der Code hat 5 Zeichen.'); return; }
  S = blank();
  S.code = code; S.role='guest'; S.token = rand(16, 'abcdefghijklmnopqrstuvwxyz0123456789');
  R.full=false; R.hostOffline=false; R.backoff=0; save(); setHash(code); startLink(); wake(); paint();
}
function leaveGame(){
  send({t:'bye'});
  setTimeout(() => { stopLink(); S = blank(); save(); setHash(''); R.confirmLeave=false; R.status='idle'; R.sel=null; paint(); }, 60);
}
function setReady(v){
  if (v && !validLayout(S.ships, FLEETS[S.fleet])) return;
  S.ready = v; save(); send({t:'ready', ready:v}); paint();
}
function rematch(){
  resetGame(S.g + 1); save(); send({t:'again'}); sendHello(); paint();
}
async function share(){
  const url = shareUrl();
  if (navigator.share){
    try{ await navigator.share({title:'Schiffe versenken', text:'Komm in mein Spiel!', url}); return; }
    catch(e){ if (e && e.name==='AbortError') return; }
  }
  copyLink();
}
function copyLink(){
  const url = shareUrl();
  const fallback = () => { R.showLink = true; paint(); const i=$('linkIn'); if(i){ i.focus(); i.select(); } toast('Link markiert. Jetzt kopieren.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(()=>toast('Link kopiert'), fallback);
  else fallback();
}
let toastTimer=null;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ================= rendering ================= */
function seaHTML(id, target, cls){
  let h = `<div class="sea ${cls||''}" id="${id}"><div class="cols">`;
  for (const l of LETTERS) h += `<span>${l}</span>`;
  h += `</div><div class="rows">`;
  for (let i=1;i<=10;i++) h += `<span>${i}</span>`;
  h += `</div><div class="board">`;
  for (let c=0;c<100;c++) h += target
    ? `<button type="button" class="cell" data-c="${c}" aria-label="${cellName(c)}"></button>`
    : `<div class="cell" data-c="${c}"></div>`;
  return h + `</div></div>`;
}
function paintBoard(id, m){
  const sea = $(id); if (!sea) return;
  const cells = sea.querySelector('.board').children;
  for (let c=0;c<100;c++){ const k = 'cell' + (m[c]||''); if (cells[c].className!==k) cells[c].className = k; }
}
function addShip(m, cells, base){
  const h = cells.length<2 || cells[1]-cells[0]===1;
  cells.forEach((c,i) => { m[c] = (m[c]||'') + ' ' + base + (h?' sh':' sv') + (i===0?' s0':'') + (i===cells.length-1?' s1':''); });
}
function pipsHTML(fleet, deadLens){
  const dead = deadLens.slice();
  return `<div class="pips">` + fleet.map(len => {
    const k = dead.indexOf(len); const d = k>=0; if (d) dead.splice(k,1);
    return `<span class="pip${d?' dead':''}" title="${NAMES[len]}">${'<i></i>'.repeat(len)}</span>`;
  }).join('') + `</div>`;
}
function screenName(){
  if (R.full) return 'full';
  if (!S.code) return 'lobby';
  if (S.role==='guest' && !S.met) return 'joining';
  if (!started() && !(S.ready && S.peerReady)) return 'setup';
  return 'battle';
}

    [38,48,58,13].forEach(c=>demo[c]+=' hit'); [5,27,41,66,93,60].forEach(c=>demo[c]=(demo[c]||'')+' miss');

      <section class="note" id="invite">

        <p class="small soft">Schick den Link an dein Gegenüber. Alternativ: Seite öffnen und den Code eintippen.</p>
        <div id="linkWrap" hidden><input class="link-in" id="linkIn" readonly></div>
        <button type="button" class="btn quiet" id="btnCopy" style="align-self:flex-start">Link kopieren</button>
      </section>
      <section class="stack">
        <div><h2>Stell deine Flotte auf</h2><p class="small soft" id="setupHint"></p></div>

        <div class="row" id="setupBtns"></div>
        <p class="small" id="oppState"></p>
      </section>
      ${RULES}
      <div id="leaveBox"></div>`;
  }
  else if (name==='battle'){
    view.innerHTML = `

function paintConn(){
  const el = $('conn');
  if (!S.code){ el.hidden = true; return; }
  el.hidden = false;
  $('connCode').textContent = S.code;
  let cls='wait', txt='Verbinde…';
  if (online()){ cls='on'; txt='Verbunden'; }
  else if (R.peerLeft){ cls='off'; txt='Gegner ist weg'; }
  else if (R.status==='waiting'){ cls='wait'; txt = S.guest ? 'Gegner offline' : 'Warte auf Mitspieler'; }
  else if (R.status==='reconnecting'){ cls='off'; txt='Verbinde neu…'; }
  else if (R.status==='nolib'){ cls='off'; txt='Kein Internet?'; }
  $('connDot').className = 'dot ' + cls;
  $('connText').textContent = txt;
}
function leaveHTML(){
  return R.confirmLeave
    ? `<div class="row"><span class="small grow">Spiel wirklich verlassen? Der Spielstand geht verloren.</span><button type="button" class="btn danger" id="btnLeaveYes">Verlassen</button><button type="button" class="btn" id="btnLeaveNo">Bleiben</button></div>`
    : `<button type="button" class="btn quiet" id="btnLeave">Spiel verlassen</button>`;
}
function setHTML(id, html){ const el=$(id); if (el && el._h!==html){ el.innerHTML = html; el._h = html; } }
function setText(id, t){ const el=$(id); if (el && el.textContent!==t) el.textContent = t; }

function paintSetupBoard(){
  const m = {};
  S.ships.forEach((s,i) => {
    const d = R.drag && R.drag.i===i && R.drag.moved ? R.drag : null;
    const shown = d ? {len:s.len, h:s.h, x:d.x, y:d.y} : s;
    addShip(m, cellsOf(shown), 'ship' + (d ? ' lift' + (d.ok?'':' bad') : ''));
  });
  paintBoard('seaSetup', m);
  const b = $('seaSetup') && $('seaSetup').querySelector('.board');
  if (b) b.classList.toggle('drag', !S.ready);
}

function paint(){
  const name = screenName();
  if (name!==R.screen) build(name);
  paintConn();

  if (name==='lobby'){
    $('fleetSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.fleet===R.pickFleet)));
  }
  else if (name==='joining'){
    setText('jCode', S.code);
    setText('jText', R.status==='nolib' ? 'Die Verbindung lässt sich nicht aufbauen. Prüfe dein Internet. Es wird weiter versucht.'
      : R.hostOffline ? 'Das Spiel ist gerade nicht erreichbar. Dein Gegenüber muss die Seite geöffnet haben. Es wird weiter versucht.'
      : 'Einen Moment…');
  }
  else if (name==='setup'){
    const showInvite = S.role==='host' && !S.guest;
    $('invite').hidden = !showInvite;
    if (showInvite){
      setText('invCode', S.code);
      $('linkWrap').hidden = !R.showLink;
      if ($('linkIn').value !== shareUrl()) $('linkIn').value = shareUrl();
    }
    setText('setupHint', S.ready ? 'Deine Aufstellung steht.' : 'Schiff ziehen zum Verschieben, antippen zum Drehen. Schiffe dürfen sich nicht berühren.');
    if (!R.drag) paintSetupBoard();
    setHTML('setupBtns', S.ready
      ? `<button type="button" class="btn grow" id="btnUnready">Doch noch ändern</button>`
      : `<button type="button" class="btn grow" id="btnShuffle">Neu mischen</button><button type="button" class="btn primary grow" id="btnReady">Bereit</button>`);
    let opp;
    if (!online()) opp = (S.role==='host' && !S.guest) ? 'Dein Mitspieler ist noch nicht da.' : 'Dein Mitspieler ist gerade nicht verbunden.';
    else if (S.peerReady) opp = S.ready ? '' : 'Dein Mitspieler ist bereit und wartet auf dich.';
    else opp = S.ready ? 'Du bist bereit. Dein Mitspieler stellt noch auf.' : 'Dein Mitspieler stellt gerade auf.';
    setText('oppState', opp);
    setHTML('leaveBox', leaveHTML());
  }
  else if (name==='battle'){
    const out = outcome(), t = turn(), l = lastShot();
    /* headline */
    let title, sub='';
    if (out==='won') title = '<span class="hl">Gewonnen!</span>';
    else if (out==='lost') title = 'Verloren';
    else if (t==='me') title = '<span class="hl">Du bist dran</span>';
    else if (t==='wait') title = 'Schuss unterwegs…';
    else title = 'Gegner ist dran';
    if (l){
      const nm = cellName(l.c), len = l.sunk ? l.sunk.length : 0;
      if (l.mine) sub = l.r==null ? `Dein Schuss auf ${nm}…`
        : l.r==='m' ? `${nm}: Wasser.`
        : len ? `${nm}: Treffer, ${NAMES[len]||'Schiff'} versenkt!` + (out?'':' Du darfst nochmal.')
        : `${nm}: Treffer!` + (out?'':' Du darfst nochmal.');
      else sub = l.r==='m' ? `Gegner schießt auf ${nm}: Wasser.`
        : len ? `Gegner versenkt ${YOURS[len]||'dein Schiff'} (${nm}).`
        : `Gegner trifft auf ${nm}.`;
    } else sub = t==='me' ? 'Du eröffnest das Spiel. Tippe ein Feld an.' : 'Dein Gegner eröffnet das Spiel.';
    if (out==='won') sub = 'Du hast die ganze gegnerische Flotte versenkt.';
    if (out==='lost') sub = 'Deine Flotte ist versenkt. Gestrichelt siehst du, was übrig war.';
    setHTML('stTitle', title);
    const el = $('stSub');
    if (!online() && !out){ el.className='small warn'; setText('stSub', R.peerLeft ? 'Dein Gegner hat das Spiel verlassen.' : 'Verbindung unterbrochen. Es wird neu verbunden…'); }
    else { el.className='small soft'; setText('stSub', sub); }

    /* target board */
    const m = {}, sunkLens = [];
    const firedSet = new Set(S.fired.map(f=>f.c));
    for (const f of S.fired){
      if (f.r==null) m[f.c] = ' pend';
      else if (f.r==='m') m[f.c] = ' miss';
      else m[f.c] = ' hit';
    }
    for (const f of S.fired) if (f.sunk){
      sunkLens.push(f.sunk.length);
      const mm = {}; addShip(mm, f.sunk, 'ship sunk');
      f.sunk.forEach(c => m[c] = (m[c]||'') + mm[c]);
      around(f.sunk).forEach(c => { if (!firedSet.has(c)) m[c] = ' nope'; });
    }
    if (out && S.reveal) S.reveal.forEach(s => {
      const cs = cellsOf(s); if (cs.every(c=>firedSet.has(c) && (m[c]||'').includes('sunk'))) return;
      const mm = {}; addShip(mm, cs, 'ship ghost'); cs.forEach(c => m[c] = (m[c]||'') + mm[c]);
    });
    const canAim = !out && t==='me';
    if (R.sel!=null && (!canAim || firedSet.has(R.sel) || (m[R.sel]||'').includes('nope'))) R.sel = null;
    if (R.sel!=null) m[R.sel] = (m[R.sel]||'') + ' sel';
    if (l && l.mine) m[l.c] = (m[l.c]||'') + ' last';
    paintBoard('seaTarget', m);
    $('seaTarget').querySelector('.board').classList.toggle('locked', !canAim);

    /* fire button / rematch */
    setHTML('fireBox', out
      ? `<button type="button" class="btn primary" id="btnAgain" style="width:100%">Revanche</button>`
      : `<button type="button" class="btn fire" id="btnFire" ${R.sel!=null && canAim && online() ? '' : 'disabled'}>${
          !canAim ? (t==='wait' ? 'Warte auf Antwort…' : 'Gegner zielt…')
          : !online() ? 'Keine Verbindung'
          : R.sel!=null ? `Feuer auf ${cellName(R.sel)}` : 'Feld antippen zum Zielen'}</button>`);

    /* own board */
    const o = {}, lost = [];
    const hitSet = new Set(S.recv.filter(f=>f.r==='h').map(f=>f.c));
    S.ships.forEach(s => { const cs = cellsOf(s); const dead = cs.every(c=>hitSet.has(c)); if (dead) lost.push(s.len); addShip(o, cs, 'ship' + (dead?' dead':'')); });
    for (const f of S.recv) o[f.c] = (o[f.c]||'') + (f.r==='h' ? ' hit' : ' miss');
    if (l && !l.mine) o[l.c] = (o[l.c]||'') + ' last';
    paintBoard('seaOwn', o);

    const fleet = FLEETS[S.fleet];
    setHTML('tally', `
      <div><div class="label">Gegner</div><div class="small">${sunkLens.length} von ${fleet.length} versenkt</div>${pipsHTML(fleet, sunkLens)}</div>
      <div><div class="label">Du</div><div class="small">${lost.length} von ${fleet.length} verloren</div>${pipsHTML(fleet, lost)}</div>`);
    setHTML('leaveBox', leaveHTML());
  }
}

/* ================= input ================= */
view.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.fleet){ R.pickFleet = b.dataset.fleet; paint(); return; }
  if (b.classList.contains('cell') && R.screen==='battle'){
    const c = +b.dataset.c;
    if (outcome() || turn()!=='me') return;
    if (S.fired.some(f=>f.c===c) || b.classList.contains('nope')) return;
    if (R.sel===c){ fire(); return; }
    R.sel = c; paint(); return;
  }
  switch (b.id){
    case 'btnCreate': createGame(); break;
    case 'btnBack': R.full=false; stopLink(); S=blank(); save(); setHash(''); R.status='idle'; paint(); break;
    case 'btnShare': share(); break;
    case 'btnCopy': copyLink(); break;
    case 'btnShuffle': S.ships = randomLayout(FLEETS[S.fleet]); save(); paint(); break;
    case 'btnReady': setReady(true); break;
    case 'btnUnready': setReady(false); break;
    case 'btnFire': fire(); break;
    case 'btnAgain': rematch(); break;
    case 'btnLeave': R.confirmLeave = true; paint(); break;
    case 'btnLeaveNo': R.confirmLeave = false; paint(); break;
    case 'btnLeaveYes': leaveGame(); break;
  }
});
view.addEventListener('submit', e => { e.preventDefault(); if (e.target.id==='joinForm') joinGame($('joinCode').value); });
view.addEventListener('input', e => { if (e.target.id==='joinCode'){ const v = cleanCode(e.target.value); if (v!==e.target.value) e.target.value = v; } });

/* placing ships: drag to move, tap to rotate */
function boardPos(board, e){
  const r = board.getBoundingClientRect();
  return { x: Math.max(0, Math.min(9, Math.floor((e.clientX - r.left) / r.width * 10))),
           y: Math.max(0, Math.min(9, Math.floor((e.clientY - r.top) / r.height * 10))) };
}
view.addEventListener('pointerdown', e => {
  if (R.screen!=='setup' || S.ready || R.drag) return;
  const cell = e.target.closest('#seaSetup .cell'); if (!cell) return;
  const c = +cell.dataset.c;
  const i = S.ships.findIndex(s=>cellsOf(s).includes(c)); if (i<0) return;
  const s = S.ships[i], board = cell.parentNode;
  e.preventDefault();
  try{ board.setPointerCapture(e.pointerId); }catch(err){}
  R.drag = { i, board, id:e.pointerId, off: s.h ? c%10 - s.x : Math.floor(c/10) - s.y, x:s.x, y:s.y, ok:true, sx:e.clientX, sy:e.clientY, moved:false, cell:c };
});
view.addEventListener('pointermove', e => {
  const d = R.drag; if (!d || e.pointerId!==d.id) return;
  if (!d.moved && Math.hypot(e.clientX-d.sx, e.clientY-d.sy) < 8) return;
  d.moved = true;
  const s = S.ships[d.i], p = boardPos(d.board, e);
  const x = Math.max(0, Math.min(s.h ? 10-s.len : 9, s.h ? p.x - d.off : p.x));
  const y = Math.max(0, Math.min(s.h ? 9 : 10-s.len, s.h ? p.y : p.y - d.off));
  d.x = x; d.y = y; d.ok = fits(S.ships, d.i, {len:s.len, h:s.h, x, y});
  paintSetupBoard();
});
function endDrag(e, cancelled){
  const d = R.drag; if (!d || e.pointerId!==d.id) return;
  R.drag = null;
  const s = S.ships[d.i];
  if (!cancelled){
    if (!d.moved) rotate(d.i, d.cell, d.board);
    else if (d.ok){ s.x = d.x; s.y = d.y; save(); }
    else toast('Hier ist kein Platz. Schiffe dürfen sich nicht berühren.');
  }
  paintSetupBoard();
}
view.addEventListener('pointerup', e => endDrag(e, false));
view.addEventListener('pointercancel', e => endDrag(e, true));
function rotate(i, pivot, board){
  const s = S.ships[i], px = pivot%10, py = Math.floor(pivot/10);
  const k0 = s.h ? px - s.x : py - s.y;
  const order = [k0]; for (let k=0;k<s.len;k++) if (k!==k0) order.push(k);
  for (const k of order){
    const cand = {len:s.len, h:!s.h, x: s.h ? px : px - k, y: s.h ? py - k : py};
    if (fits(S.ships, i, cand)){ S.ships[i] = cand; save(); return; }
  }
  board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake');
  toast('Kein Platz zum Drehen.');
}

/* ================= boot ================= */
(function boot(){
  const hash = cleanCode(location.hash.slice(1));
  if (S.code){
    if (!validLayout(S.ships, FLEETS[S.fleet]) && !started() && (S.role==='host' || S.met)) S.ships = randomLayout(FLEETS[S.fleet]);
    if (hash.length===5 && hash!==S.code && !started()){ joinGame(hash); return; }
    setHash(S.code); startLink(); wake();
  } else if (hash.length===5){ joinGame(hash); return; }
  paint();
})();
window.addEventListener('hashchange', () => {
  const hash = cleanCode(location.hash.slice(1));
  if (hash.length===5 && hash!==S.code && !started()) joinGame(hash);
});
})();
</script>
